name: Publicar teste agora

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-now.yml"

permissions:
  contents: read

jobs:
  publish-now:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Enviar publicação de teste
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const token = String(process.env.TELEGRAM_BOT_TOKEN || "").trim();
          const chatId = String(process.env.TELEGRAM_CHANNEL_ID || "").trim();

          if (!token || !chatId) throw new Error("Secrets do Telegram não configurados");

          const text =
            "💡 <b>ORGANIZAÇÃO FINANCEIRA COMEÇA PELA CLAREZA</b>\n\n" +
            "Ter controle financeiro não significa deixar de viver. Significa saber quanto entra, quanto sai e quais escolhas estão consumindo sua renda.\n\n" +
            "Quando você registra seus gastos, pequenas despesas deixam de passar despercebidas e começam a revelar padrões. É aí que decisões melhores se tornam possíveis.\n\n" +
            "📊 No <b>EduCashPro</b>, você pode usar gratuitamente a ferramenta de Controle Financeiro para registrar entradas e despesas e acompanhar melhor sua organização.\n\n" +
            "Comece pelo que aconteceu hoje. Registre seus gastos e transforme informação em decisão.\n\n" +
            "📚 <b>EduCashPro | Educação Financeira para decisões mais conscientes.</b>";

          const body = {
            chat_id: chatId,
            text,
            parse_mode: "HTML",
            disable_web_page_preview: true,
            reply_markup: {
              inline_keyboard: [[{
                text: "📊 Abrir EduCashPro",
                url: "https://go.educashpro.vip"
              }]]
            }
          };

          const response = await fetch(`https://api.telegram.org/bot${token}/sendMessage`, {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify(body)
          });

          const data = await response.json().catch(() => ({}));
          if (!response.ok || data?.ok !== true) {
            throw new Error(data?.description || `Telegram HTTP ${response.status}`);
          }

          console.log(`✅ Publicação enviada. message_id=${data.result?.message_id ?? "n/a"}`);
          NODE
